name: Android reminder APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'reminder-android/**'
      - '.github/workflows/android-reminder.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$MANAGER"
          bash "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        run: |
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - run: python3 generate_sounds.py
        working-directory: reminder-android
      - run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
        working-directory: reminder-android
      - uses: actions/upload-artifact@v4
        with:
          name: StructureReminder-APK
          path: reminder-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
