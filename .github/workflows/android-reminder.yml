name: Android reminder APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'reminder-android/**'
      - '.github/workflows/android-reminder.yml'
permissions:
  contents: write
concurrency:
  group: reminder-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$MANAGER"
          bash "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Gradle
        run: |
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - run: python3 generate_sounds.py
        working-directory: reminder-android
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REMINDER_VERSION: ${{ github.run_number }}
        working-directory: reminder-android
        run: |
          set -eu
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/structure-reminder.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          for attempt in 1 2 3; do
            if /tmp/gradle-8.9/bin/gradle --no-daemon --max-workers=2 assembleRelease > /tmp/reminder-build.log 2>&1; then
              cat /tmp/reminder-build.log
              break
            fi
            cat /tmp/reminder-build.log
            if [ "$attempt" = 3 ] || ! grep -Eq '429|Too Many Requests' /tmp/reminder-build.log; then exit 1; fi
            sleep "$((attempt * 90))"
          done
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" "$RUNNER_TEMP/StructureReminder.apk"
      - name: Publish signed update
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "reminder-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" "$RUNNER_TEMP/StructureReminder.apk" --target "$GITHUB_SHA" --title "Structure Reminder ${GITHUB_RUN_NUMBER}" --notes "Signed Android update" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: StructureReminder-APK
          path: ${{ runner.temp }}/StructureReminder.apk
          if-no-files-found: error
