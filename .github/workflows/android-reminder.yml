name: Android reminder APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'reminder-android/**'
      - '.github/workflows/android-reminder.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 generate_sounds.py
        working-directory: reminder-android
      - run: gradle --no-daemon assembleDebug
        working-directory: reminder-android
      - uses: actions/upload-artifact@v4
        with:
          name: StructureReminder-APK
          path: reminder-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
