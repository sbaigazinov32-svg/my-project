plugins { id 'com.android.application' }
android {
 namespace 'kz.structure.reminder'; compileSdk 35
 defaultConfig { applicationId 'kz.structure.reminder'; minSdk 26; targetSdk 35; versionCode (System.getenv('REMINDER_VERSION') ?: '2').toInteger(); versionName "0.2."+versionCode }
 signingConfigs {
  release {
   if (System.getenv('ANDROID_KEYSTORE_PATH')) {
    storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias 'structure'
    keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    storeType 'PKCS12'
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
