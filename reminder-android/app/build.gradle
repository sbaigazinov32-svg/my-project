plugins { id 'com.android.application' }
def reminderVersion = (System.getenv('REMINDER_VERSION') ?: '2').toInteger()
android {
 namespace 'kz.structure.reminder'; compileSdk 35
 defaultConfig {
  applicationId 'kz.structure.reminder'
  minSdk 26
  targetSdk 35
  versionCode = reminderVersion
  versionName = "0.2.${reminderVersion}"
 }
 signingConfigs {
  release {
   if (System.getenv('ANDROID_KEYSTORE_PATH')) {
    storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias 'structure'
    keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    storeType 'PKCS12'
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
